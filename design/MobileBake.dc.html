<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        />
        <style>
          * {
            box-sizing: border-box;
          }
          body {
            margin: 0;
            background: #0f0d0b;
            color: #f5f0e8;
            font-family: "Instrument Sans", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
          }
          a {
            color: #e8a33d;
            text-decoration: none;
          }
          a:hover {
            color: #f2b457;
          }
          ::placeholder {
            color: #6e665c;
          }
        </style>
      </helmet>

      <div

          height: 844px;

            transparent 72%
          );
          display: flex;
          flex-direction: column;
        "
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px 12px;
          "
        >
          <div style="display: flex; align-items: center; gap: 8px">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="12"
                r="9.25"
                stroke="#E8A33D"
                stroke-width="1.5"
              />
              <circle cx="9.2" cy="9.6" r="1.35" fill="#E8A33D" />
              <circle cx="14.6" cy="12.4" r="1.1" fill="#E8A33D" />

            <span
              style="
                font-family: &quot;Bricolage Grotesque&quot;, system-ui;

                font-weight: 700;
                letter-spacing: -0.02em;
              "
              >Cookie Bakery</span
            >
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 7px;
              height: 34px;
              padding: 0 11px;
              background: #171412;
              border: 1px solid #241f1b;
              border-radius: 999px;
            "
          >
            <span
              style="
                width: 6px;
                height: 6px;
                border-radius: 999px;
                background: #5fbf8c;
              "
            ></span>
            <span
              style="
                font-family: &quot;JetBrains Mono&quot;, monospace;
                font-size: 11.5px;
                color: #f5f0e8;
              "
              >6MGL&#8230;zRQa</span
            >
          </div>
        </div>
        <div
          style="
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 6px 18px 18px;
            overflow: hidden;
          "
        >
          <div style="display: flex; flex-direction: column; gap: 5px">
            <span style="font-size: 12px; color: #8c8377">Balance</span>
            <div style="display: flex; align-items: baseline; gap: 8px">
              <span
                style="
                  font-family: &quot;Bricolage Grotesque&quot;, system-ui;
                  font-size: 38px;
                  font-weight: 700;
                  letter-spacing: -0.035em;
                  font-variant-numeric: tabular-nums;
                "
                >5,140.46</span
              >
              <span style="font-size: 15px; font-weight: 600; color: #8c8377"
                >COOK</span
              >
            </div>
          </div>

          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 14px;
              padding: 18px;
              background: #171412;
              border: 1px solid #241f1b;
              border-radius: 20px;
            "
          >
            <span
              style="
                font-family: &quot;Bricolage Grotesque&quot;, system-ui;
                font-size: 19px;
                font-weight: 700;
                letter-spacing: -0.02em;
              "
              >Bake a token</span
            >

            <div style="display: flex; flex-direction: column; gap: 6px">
              <label
                style="
                  font-size: 11px;
                  font-weight: 600;
                  letter-spacing: 0.06em;
                  text-transform: uppercase;
                  color: #8c8377;
                "
                >Name</label
              >
              <div
                style="
                  height: 48px;
                  display: flex;
                  align-items: center;
                  padding: 0 14px;
                  background: #0f0d0b;
                  border: 1px solid #2a2521;
                  border-radius: 13px;
                  font-size: 15px;
                "
              >
                Bakery Cookie
              </div>
            </div>

            <div
              style="
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
              "
            >
              <div style="display: flex; flex-direction: column; gap: 6px">
                <label
                  style="
                    font-size: 11px;
                    font-weight: 600;
                    letter-spacing: 0.06em;
                    text-transform: uppercase;
                    color: #8c8377;
                  "
                  >Symbol</label
                >
                <div
                  style="
                    height: 48px;
                    display: flex;
                    align-items: center;
                    padding: 0 14px;
                    background: #0f0d0b;

                    font-family: &quot;JetBrains Mono&quot;, monospace;

                <label

                    font-size: 11px;
                    font-weight: 600;
                    letter-spacing: 0.06em;
                    text-transform: uppercase;
                    color: #8c8377;
                  "
                  >Decimals</label
                >
                <div
                  style="
                    height: 48px;
                    display: flex;
                    align-items: center;
                    padding: 0 14px;
                    background: #0f0d0b;
                    border: 1px solid #2a2521;
                    border-radius: 13px;
                    font-family: &quot;JetBrains Mono&quot;, monospace;
                    font-size: 14.5px;
                  "
                >
                  6
                </div>
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px">
              <label
                style="
                  font-size: 11px;
                  font-weight: 600;
                  letter-spacing: 0.06em;
                  text-transform: uppercase;
                  color: #8c8377;
                "
                >Initial supply</label
              >
              <div
                style="
                  height: 48px;
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  padding: 0 14px;
                  background: #0f0d0b;
                  border: 1px solid #2a2521;
                  border-radius: 13px;
                "
              >
                <span
                  style="
                    font-family: &quot;JetBrains Mono&quot;, monospace;
                    font-size: 14.5px;
                    font-variant-numeric: tabular-nums;
                  "
                  >1,000,000</span
                >
                <span style="font-size: 12.5px; color: #6e665c">BAKE</span>
              </div>
            </div>

            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: 48px;
                padding: 0 14px;
                background: #0f0d0b;
                border: 1px solid #211d19;
                border-radius: 13px;
              "
            >
              <span style="font-size: 14px; font-weight: 500; color: #a39b8f"
                >Advanced options</span
              >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path
                  d="M9 6l6 6-6 6"
                  stroke="#57504A"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>

          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 14px 16px;
              background: rgba(232, 163, 61, 0.05);
              border: 1px solid rgba(232, 163, 61, 0.18);
              border-radius: 15px;
            "
          >
            <span style="font-size: 13px; color: #a39b8f">Estimated cost</span>
            <span
              style="
                font-family: &quot;JetBrains Mono&quot;, monospace;
                font-size: 14px;
                font-weight: 600;
                color: #e8a33d;
                font-variant-numeric: tabular-nums;
              "
              >0.00527 COOK</span
            >
          </div>

          <div
            style="
              height: 54px;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              background: #e8a33d;
              border-radius: 15px;
              color: #1a1410;
              font-size: 16px;
              font-weight: 700;
              box-shadow: 0 12px 30px -14px rgba(232, 163, 61, 0.6);
            "
          >
            Review transaction
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M5 12h13M13 6l6 6-6 6"
                stroke="#1A1410"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </div>
        <div
          style="
            height: 74px;
            display: flex;
            align-items: flex-start;
            padding-top: 10px;
            border-top: 1px solid #211d19;
            background: #121010;
          "
        >
          <div
            style="
              flex-grow: 1;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 5px;
              height: 100%;
            "
          >
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="12"
                r="8.6"
                stroke="#E8A33D"
                stroke-width="1.7"

          </div>
          <div
            style="
              flex-grow: 1;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 5px;
              height: 100%;
            "
          >
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 4v11M7.8 10.8L12 15l4.2-4.2"
                stroke="#57504A"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

                d="M5 19h14"
                stroke="#57504A"
                stroke-width="1.8"
                stroke-linecap="round"
              /></svg
            ><span style="font-size: 10.5px; font-weight: 600; color: #6e665c"
              >Airdrop</span

          </div>
          <div
            style="
              flex-grow: 1;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 5px;
              height: 100%;
            "
          >
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
              <path
                d="M4 19V10M10 19V5M16 19v-6"
                stroke="#57504A"
                stroke-width="1.8"

                stroke-width="1.8"
                stroke-linecap="round"
